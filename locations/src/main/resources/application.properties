spring.application.name=locations
server.port=8080

spring.main.banner-mode=off
logging.level.root=WARN

# Base H2 en mémoire, recréée à chaque démarrage.
spring.datasource.url=jdbc:h2:mem:locations;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Où joindre le service du parc.
locations.url-parc=http://localhost:8081

# Origine autorisée pour l'interface web (voir ConfigurationCors).
locations.origine-frontale=http://localhost:4200
